services:
  versioning:
    image: car-accident-versioning:resume-20261009
    build:
      context: ./src/versioning
      dockerfile: Dockerfile
    working_dir: /repo
    environment:
      DVC_SITE_CACHE_DIR: /tmp/dvc-site-cache
    volumes:
      - type: bind
        source: .
        target: /repo
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /repo/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./src/models/trained_model.joblib
        target: /repo/src/models/trained_model.joblib
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        # Machine-specific historical store; set DVC_LOCAL_STORE on the owner's machine.
        source: ${DVC_LOCAL_STORE:?Set DVC_LOCAL_STORE to the local DVC store directory}
        target: /store
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
      - /root
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
