# Lint and run the unit tests with the pinned runtime dependencies.
name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      # Same setting as the runtime image (Dockerfile).
      PANDAS_COPY_ON_WRITE: "0"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        # Same Python version as the runtime image (Dockerfile).
        python-version: "3.11"
        cache: pip
        cache-dependency-path: |
          requirements-runtime.txt
          src/api/requirements.txt
          src/tracking/requirements.txt
          src/versioning/requirements.txt
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-runtime.txt -r src/api/requirements.txt -r src/tracking/requirements.txt -r src/versioning/requirements.txt
        pip install flake8 pytest
        pip check
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Provide the example features the app image bakes in
      run: |
        # compose.app.yaml copies this file into the image at build time
        cp src/models/test_features.json src/app/example_features.json
    - name: Test with pytest
      run: |
        RUN_VERSION_TEST_ROOT="$(mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP is required}/run-version-tests.XXXXXXXX")"
        export RUN_VERSION_TEST_ROOT
        pytest

  airflow-dag:
    name: Airflow DAG
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the Airflow image
      run: docker compose -f compose.airflow.yaml build
    - name: Load the DAG and test its structure in the image
      run: |
        docker run --rm --entrypoint bash -e REQUIRE_AIRFLOW=1 -v "$PWD:/repo:ro" car-accident-airflow:local -c '
          set -e
          pip install --quiet --user pytest==8.4.2
          cp -r /repo/airflow /repo/src /repo/dvc.yaml /repo/compose.airflow.yaml /repo/pytest.ini /tmp/
          cd /tmp
          python -m pytest -q -p no:cacheprovider src/test_airflow_dag.py'

  javascript-tests:
    name: JavaScript app logic
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: "24"
        package-manager-cache: false
    - name: Test app logic
      run: node --test --test-reporter=tap src/app/test_app_logic.cjs
  docker-ci:
    name: Docker image builds and Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configurations
        env:
          DVC_LOCAL_STORE: /tmp/dvc-store
        run: |
          docker compose -f compose.yaml -f compose.api.yaml -f compose.app.yaml config --quiet
          docker compose -f compose.pipeline.yaml config --quiet
          docker compose -f compose.tracking.yaml config --quiet
          docker compose -f compose.versioning.yaml config --quiet

      - name: Build runtime image
        run: docker compose -f compose.yaml build workspace

      - name: Build API image
        run: docker compose -f compose.yaml -f compose.api.yaml build api

      - name: Build App image
        run: docker compose -f compose.yaml -f compose.api.yaml -f compose.app.yaml build app

      - name: Build pipeline image
        run: docker compose -f compose.pipeline.yaml build

      - name: Build tracking images
        run: docker compose -f compose.tracking.yaml build

      - name: Build versioning image
        run: docker compose -f compose.versioning.yaml build
